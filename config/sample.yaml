# Example test. Run it with:
#   cd backend && python -m app.cli run ../config/sample.yaml
# The URL points at the bundled sample app (scripts/dev.sh starts it on port 9000).
name: Sample load test
target_url: http://127.0.0.1:9000/slow?ms=120
method: GET
users: 20
duration_seconds: 30
ramp_up_seconds: 10
# For a traffic profile, set ramp_up_seconds to 0 and give the steps instead (see spike.yaml,
# step-load.yaml and breakpoint.yaml). Each step changes to that many users at its time, over
# its ramp if it has one; users is then the highest step:
# duration_seconds: 90
# profile:
#   - time_seconds: 0
#     users: 10
#   - time_seconds: 30
#     users: 50
#     ramp_seconds: 10
#   - time_seconds: 60
#     users: 0          # a pause
think_time_ms: 100
timeout_ms: 10000
expected_status_codes: [200]
headers:
  Accept: application/json
thresholds:
  max_error_rate_percent: 1.0
  max_p95_ms: 500
